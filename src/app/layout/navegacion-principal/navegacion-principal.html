<!--
  Barra lateral. Es un `nav` propio, fuera del `header` del shell: el `header` es la barra
  superior (landmark `banner`) y esta es la navegacion (landmark `navigation`, nombrada).
  `id` para el `aria-controls` del boton de menu de la barra superior.
-->
@if (mostrarBarra()) {
  <nav
    id="navegacion-principal"
    class="barra-lateral"
    [class.barra-lateral--abierta]="abierto()"
    aria-label="Secciones de AKINE"
  >
    <a class="marca" [routerLink]="rutaInicio" (click)="navegar()">AKINE</a>

    @for (grupo of grupos(); track grupo.etiqueta) {
      <!--
        El rotulo del grupo no es un enlace ni un encabezado: es el nombre de la lista que sigue,
        y la lista lo toma como nombre accesible. Un `h2` por grupo metia seis encabezados en
        cada pantalla antes del `h1`.
      -->
      <p class="nav__rotulo" [id]="'grupo-' + grupo.etiqueta">{{ grupo.etiqueta }}</p>
      <ul class="nav__grupo" [attr.aria-labelledby]="'grupo-' + grupo.etiqueta">
        @for (seccion of grupo.secciones; track seccion.ruta) {
          <li>
            <!--
              `aria-current="page"` y no solo la clase: el color de la marca no existe para un
              lector de pantalla. La entrada actual la decide `seccionDe`, por prefijo mas largo.
            -->
            <a
              class="nav__enlace"
              [class.nav__enlace--actual]="esActual(seccion)"
              [routerLink]="seccion.ruta"
              [attr.aria-current]="esActual(seccion) ? 'page' : null"
              (click)="navegar()"
              >{{ seccion.etiqueta }}</a
            >
          </li>
        }
      </ul>
    }

    <!--
      Un administrador de plataforma con contexto tiene ademas su consola, separada al pie: no es
      una seccion del centro.
    -->
    @if (esAdminDePlataforma()) {
      <ul class="nav__grupo nav__grupo--plataforma" aria-label="Plataforma">
        <li>
          <a
            class="nav__enlace"
            [routerLink]="rutaPlataforma"
            [attr.aria-current]="esActual(seccionPlataforma) ? 'page' : null"
            [class.nav__enlace--actual]="esActual(seccionPlataforma)"
            (click)="navegar()"
            >Plataforma</a
          >
        </li>
      </ul>
    }
  </nav>
}
