<form [formGroup]="formulario" (ngSubmit)="confirmar()" novalidate>
  @if (mostrarTitulo()) {
    <h3 class="panel__titulo">{{ titulo() }}</h3>
  }

  <ng-content />

  <div class="campo campo--ancho">
    <label [attr.for]="idCampo()">{{ etiqueta() }}</label>
    <input
      #campoMotivo
      type="text"
      autocomplete="off"
      [id]="idCampo()"
      formControlName="reason"
      [attr.aria-invalid]="mostrarError()"
      [attr.aria-describedby]="descrito"
    />
    @if (ayuda() !== '') {
      <p class="ayuda ayuda--fija" [id]="idAyuda">{{ ayuda() }}</p>
    }
    @if (mostrarError()) {
      <p class="campo__error" [id]="idError">{{ textoError() }}</p>
    }
  </div>

  <div class="acciones">
    <button type="submit" class="boton" [disabled]="enviando()">{{ textoConfirmar() }}</button>
    <button type="button" class="boton boton--secundario" (click)="cancelado.emit()">
      Cancelar
    </button>
  </div>
</form>
