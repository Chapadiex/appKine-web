@if (totalPaginas() > 1) {
  <nav class="paginacion" [attr.aria-label]="etiqueta()">
    <button
      type="button"
      class="boton boton--secundario"
      [disabled]="paginaActual() === 0"
      (click)="ir(paginaActual() - 1)"
    >
      Anterior
    </button>
    <span class="ayuda">Pagina {{ paginaActual() + 1 }} de {{ totalPaginas() }}</span>
    <button
      type="button"
      class="boton boton--secundario"
      [disabled]="paginaActual() + 1 >= totalPaginas()"
      (click)="ir(paginaActual() + 1)"
    >
      Siguiente
    </button>
  </nav>
}
