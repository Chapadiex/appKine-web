@let m = modelo();
<app-cabecera-de-pagina [titulo]="titulo() ?? m.titulo">
  <ng-content select="app-ayuda, akine-ayuda" ngProjectAs="app-ayuda" />
  <!--
    En una hermana el titulo es el de la seccion: la persona sigue a la vista como dato (la ruta de
    navegacion de la barra superior la nombra y enlaza a su ficha).
  -->
  @if (titulo() !== null) {
    <span class="cabecera-ficha__dato cabecera-ficha__persona" [title]="persona()">{{
      persona()
    }}</span>
  } @else {
    @for (dato of m.datos; track $index) {
      <span class="cabecera-ficha__dato">{{ dato }}</span>
    }
  }
  @for (marca of m.marcas; track $index) {
    @if (marca.tono === 'neutra') {
      <span class="cabecera-ficha__perfil">{{ marca.texto }}</span>
    } @else {
      <span
        class="marca-estado"
        [class.marca-estado--activa]="marca.tono === 'activa'"
        [class.marca-estado--revocada]="marca.tono === 'revocada'"
        >{{ marca.texto }}</span
      >
    }
  }
  <div cabeceraAcciones>
    <ng-content select="[cabeceraAcciones]" />
    <ng-content />
  </div>
  <app-pestanas [pestanas]="m.pestanas" [etiqueta]="m.etiquetaPestanas" />
</app-cabecera-de-pagina>
