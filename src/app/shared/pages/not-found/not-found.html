<!-- Pagina no encontrada: misma cabecera que el resto de la aplicacion (rediseño 19/11/2026). -->
<section class="pantalla-error" aria-label="Página no encontrada">
  <app-cabecera-de-pagina titulo="Página no encontrada">
    <span class="marca-estado marca-estado--neutra">Error 404</span>
  </app-cabecera-de-pagina>
  <p role="alert">La dirección a la que intentaste llegar no existe o se movió.</p>
  <code class="pantalla-error__ruta">{{ ruta }}</code>
  <div class="pantalla-error__acciones">
    <a class="boton" routerLink="/">Ir al inicio</a>
    <button type="button" class="boton boton--secundario" (click)="volver()">Volver atrás</button>
  </div>
</section>
