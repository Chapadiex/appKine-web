<!-- Sesion expirada (diseño del canvas "AKINE · Pantallas", 22/10/2026). -->
<section class="acceso-tarjeta" aria-labelledby="titulo-expirada">
  <span class="acceso-icono acceso-icono--neutro" aria-hidden="true">
    <app-icono nombre="horarios" />
  </span>
  <h1 id="titulo-expirada">Tu sesión expiró</h1>
  <p class="acceso-texto" role="alert">
    No pudimos renovarla, así que la cerramos. Puede haber pasado demasiado tiempo, o se cerró la
    sesión en otro equipo. Nada de lo que ya guardaste se perdió.
  </p>
  <a class="boton boton--bloque" routerLink="/auth/ingresar" [queryParams]="parametrosDeVuelta()">
    Volver a ingresar
  </a>
</section>
