<form class="historia__formulario" (submit)="$event.preventDefault(); registrar()">
  <div class="campo">
    <label for="entrada-tipo">Tipo de entrada</label>
    <select id="entrada-tipo" [value]="tipo()" (change)="elegirTipo($any($event.target).value)">
      @for (opcion of tipos; track opcion[0]) {
        <option [value]="opcion[0]">{{ opcion[1] }}</option>
      }
    </select>
  </div>

  <div class="campo">
    <label for="entrada-cuerpo">Texto</label>
    <textarea
      id="entrada-cuerpo"
      rows="5"
      [value]="cuerpo()"
      [attr.aria-invalid]="intentoEnviar() && faltaCuerpo()"
      [attr.aria-describedby]="intentoEnviar() && faltaCuerpo() ? 'entrada-cuerpo-error' : null"
      (input)="cuerpo.set($any($event.target).value)"
    ></textarea>
    @if (intentoEnviar() && faltaCuerpo()) {
      <p id="entrada-cuerpo-error" class="campo__error">Escribí el contenido de la entrada.</p>
    }
  </div>

  @if (error(); as problema) {
    <p class="estado estado--error" role="alert">{{ problema.mensaje }}</p>
  }
  <p class="visualmente-oculto" aria-live="polite">{{ aviso() }}</p>

  <div class="acciones">
    <button type="submit" class="boton" [disabled]="enviando()">
      @if (enviando()) {
        Registrando…
      } @else {
        Registrar entrada
      }
    </button>
  </div>
</form>
