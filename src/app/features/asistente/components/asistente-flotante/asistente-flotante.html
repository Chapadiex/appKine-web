@if (visible()) {
  <!-- El panel queda montado mientras el botón se ve: cerrar y abrir no pierde la charla. -->
  <section
    id="asistente-flotante-panel"
    class="panel"
    [class.panel--movido]="posicion() !== null"
    [class.panel--abajo]="panelAbajo()"
    [style.--boton-x.px]="posicion()?.left"
    [style.--boton-y.px]="posicion()?.top"
    aria-labelledby="asistente-flotante-titulo"
    [hidden]="!abierto()"
  >
    <header class="panel__cabecera">
      <h2 id="asistente-flotante-titulo" class="panel__titulo">Asistente de datos</h2>
      <div class="panel__acciones">
        <button type="button" class="boton boton--secundario boton--chico" (click)="nuevaCharla()">
          Nueva charla
        </button>
        <button type="button" class="panel__cerrar" (click)="cerrar()">
          <span aria-hidden="true">×</span>
          <span class="visualmente-oculto">Cerrar el asistente</span>
        </button>
      </div>
    </header>
    <app-charla-del-asistente class="panel__charla" [compacta]="true" />
  </section>

  <!--
    Orbe (23/11/2026, diseño del usuario): en reposo respira, pensando el anillo se vuelve una
    forma que ondula, y con una respuesta sin leer el borde late. Se arrastra a cualquier lugar;
    un clic sin arrastre abre o cierra.
  -->
  <div
    class="flotante"
    [style.left.px]="posicion()?.left"
    [style.top.px]="posicion()?.top"
    [style.bottom]="posicion() ? 'auto' : null"
  >
    <button
      #disparador
      type="button"
      class="disparador"
      [class.disparador--pensando]="estado() === 'pensando'"
      [class.disparador--listo]="estado() === 'listo'"
      [class.disparador--arrastrando]="arrastrando()"
      [class.disparador--derecha]="cercaDelBordeDerecho()"
      aria-controls="asistente-flotante-panel"
      [attr.aria-expanded]="abierto()"
      (pointerdown)="empezarArrastre($event)"
      (pointermove)="arrastrar($event)"
      (pointerup)="soltar($event)"
      (pointercancel)="soltar($event)"
      (click)="alClic()"
    >
      <svg class="orbe" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle class="orbe__desgastado" cx="12" cy="12" r="10.6" />
        <circle class="orbe__anillo" cx="12" cy="12" r="7.8" />
        <path #formaInterna class="orbe__forma" d="" />
        <circle class="orbe__centro" cx="12" cy="12" r="3.4" />
      </svg>
      <span class="disparador__texto">{{ abierto() ? 'Cerrar' : 'Asistente' }}</span>
      @if (estado() === 'listo') {
        <span class="visualmente-oculto">: tenés una respuesta nueva</span>
      }
    </button>
    <!-- Ocultar el orbe desde el orbe (23/11/2026); vuelve desde «Asistente» al pie del menú. -->
    <button
      type="button"
      class="flotante__ocultar"
      title="Ocultar el asistente (se vuelve a mostrar desde el pie del menú)"
      (click)="ocultar()"
    >
      <span aria-hidden="true">×</span>
      <span class="visualmente-oculto">Ocultar el asistente</span>
    </button>
  </div>
}
