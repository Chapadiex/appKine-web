# JavaScript y CSS precomprimidos en el build (AKINE-LCP). Lo incluyen los locations de archivos
# con hash de default.conf.template, junto con security-headers.conf: nginx NO hereda los
# add_header del server dentro de un location que declara los suyos.
#
# - gzip off: el archivo ya viaja comprimido; comprimir al vuelo seria gastar CPU para nada y,
#   sobre un `.br`, codificarlo dos veces.
# - gzip_static on: sin Brotli en el pedido, sirve `chunk-X.js.gz` con su Content-Encoding.
# - Content-Encoding br: solo cuando try_files eligio el `.br` (map $akine_content_encoding). Con
#   valor vacio nginx no emite la cabecera.
# - Vary: la misma URL tiene tres cuerpos segun Accept-Encoding; una cache intermedia que lo
#   ignorara le daria Brotli a quien no lo entiende. gzip_vary se apaga para que gzip_static no
#   la repita.
gzip off;
gzip_static on;
gzip_vary off;
add_header Content-Encoding $akine_content_encoding always;
add_header Vary "Accept-Encoding" always;
add_header Cache-Control "public, max-age=31536000, immutable" always;
