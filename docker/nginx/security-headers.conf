# Cabeceras de seguridad de AKINE (G-3).
#
# Va en un archivo aparte porque nginx NO hereda los add_header del server dentro de un
# location que declara los suyos: cada location que agrega Cache-Control tiene que incluir
# este archivo, o pierde todas las cabeceras de seguridad en silencio.
#
# CSP:
# - script-src 'self' + el hash del onload que Angular emite para cargar la hoja de estilos
#   diferida (inlineCritical: `<link media="print" onload="this.media='all'">`). Sin ese hash
#   el navegador bloquea el handler y la hoja queda en media="print": la app se ve sin estilos.
#   'unsafe-hashes' habilita SOLO ese hash para atributos de evento, no cualquier inline.
# - style-src 'unsafe-inline': Angular inyecta los estilos de componente y el CSS critico en
#   elementos <style>.
# - connect-src 'self': el bundle solo habla con /api del mismo origen (proxy de este nginx).
# - blob: en img/media/frame: descargas y vistas previas generadas con URL.createObjectURL.
#
# HSTS no va aca: lo pone quien termina TLS delante de este contenedor.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
