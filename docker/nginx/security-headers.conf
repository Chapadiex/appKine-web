# Cabeceras de seguridad de AKINE (G-3, endurecidas en AKINE-09.02).
#
# Va en un archivo aparte porque nginx NO hereda los add_header del server dentro de un
# location que declara los suyos: cada location que agrega Cache-Control tiene que incluir
# este archivo, o pierde todas las cabeceras de seguridad en silencio.
#
# CSP, sin 'unsafe-inline' ni 'unsafe-hashes' (AKINE-09.02):
# - script-src y style-src: 'self' + un NONCE por respuesta. El nonce es $request_id (128 bits
#   aleatorios por pedido) y nginx lo escribe tambien en el index.html, reemplazando el marcador
#   AKINE_CSP_NONCE de `ngCspNonce` (ver el location de index.html en default.conf.template). Con
#   `ngCspNonce`, el build le pone ese nonce al CSS critico inlineado y cambia el `onload` de la
#   hoja diferida por un <script nonce>, y Angular se lo pone a cada <style> de componente que
#   inyecta en runtime. Antes hacia falta 'unsafe-inline' en style-src —cualquier <style> que un
#   XSS lograra inyectar se aplicaba— y 'unsafe-hashes' para el onload.
#   Los `[style.x]` de las plantillas no necesitan nada: Angular los aplica por CSSOM, que la CSP
#   no restringe. Un atributo `style="..."` estatico en una plantilla SI quedaria bloqueado.
# - connect-src 'self': el bundle solo habla con /api del mismo origen (proxy de este nginx).
# - blob: en img/media/frame: descargas y vistas previas generadas con URL.createObjectURL.
#
# El nonce en los assets con hash (JS, CSS) no hace nada —la CSP vale para documentos— y es
# inofensivo; se deja en el mismo snippet para no tener dos CSP que mantener.
#
# HSTS no va aca: lo pone quien termina TLS delante de este contenedor.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Todo lo que AKINE no usa queda apagado, incluido para iframes. Si una pantalla llegara a
# necesitar alguno (p. ej. la camara para fotografiar un comprobante), se habilita aca con
# (self), nunca con *.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
