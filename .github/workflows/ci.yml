name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # Un PR que sólo toca documentación no compila ni corre nada: los jobs quedan "skipped", que para
  # los checks obligatorios cuenta como éxito. En un push a main corre siempre todo. Si no se puede
  # leer la lista de archivos, también: ante la duda se prueba.
  cambios:
    name: Detectar si el PR toca código
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      codigo: ${{ steps.filtro.outputs.codigo }}

    steps:
      - name: Mirar los archivos del PR
        id: filtro
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          codigo=true
          if [ -n "$PR" ] && archivos=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)'); then
            if [ -n "$archivos" ] && ! echo "$archivos" | grep -qvE '^(docs/|\.claude/)|\.md$'; then
              codigo=false
            fi
          fi
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          echo "Toca código: $codigo"

  build:
    name: Lint, build y tests
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` en lugar de `npm install`: respeta el lockfile al pie de la letra.
      # Si package-lock.json esta desincronizado, falla en vez de resolver por su cuenta.
      - name: Instalar dependencias
        run: npm ci

      # Vulnerabilidades conocidas de las dependencias que VIAJAN al navegador (AKINE G-6).
      # `--omit=dev` deja afuera el tooling (CLI, generador de cliente, Vitest, Playwright), que no
      # llega al bundle; `--audit-level=high` falla sólo por altas y críticas para no frenar todo
      # por ruido. Las de desarrollo las propone Dependabot y se ven con `npm audit` a secas.
      - name: Auditar dependencias de produccion
        run: npm audit --omit=dev --audit-level=high

      - name: Verificar formato
        run: npm run format:check

      # ESLint incluye las reglas propias de AKINE: prohibicion de localStorage y
      # sessionStorage (ADR-0001) y las reglas de accesibilidad de plantilla, que son
      # requisito WCAG 2.1 AA del proyecto.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Incluye el gate de cobertura: falla por debajo del 80 % en cualquier contador.
      - name: Tests unitarios y cobertura
        run: npm run test:ci

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      # El cliente de src/app/api/generated NO se edita a mano. Si el commiteado difiere
      # del que produce el contrato, alguien lo toco o quedo desactualizado.
      #
      # Requiere el contrato del backend. Ver el job `contrato` mas abajo.
      - name: Publicar build
        uses: actions/upload-artifact@v7
        with:
          name: akine-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # Análisis de SonarQube (AKINE G-6). Listo y apagado hasta que existan la instancia y el token.
  #
  # Para activarlo alcanza con cargar dos secretos en Settings > Secrets and variables > Actions:
  #   SONAR_TOKEN     token de análisis del proyecto (SonarQube: My Account > Security)
  #   SONAR_HOST_URL  URL de la instancia, p. ej. https://sonarcloud.io o https://sonar.ejemplo.test
  # Sin los dos, el job termina en verde con un aviso y no corre el análisis. Los PR desde forks
  # no reciben secretos y también se saltean. El backend usa los mismos dos nombres.
  #
  # No vuelve a correr los tests: reusa el lcov.info que publica `build` en `coverage-report`.
  # El cliente generado queda fuera del análisis y de la cobertura, igual que en `angular.json`.
  sonar:
    name: Analisis SonarQube
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Verificar si SonarQube esta configurado
        id: config
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "activo=true" >> "$GITHUB_OUTPUT"
          else
            echo "activo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube sin configurar (faltan SONAR_TOKEN o SONAR_HOST_URL): se saltea el analisis."
          fi

      - name: Checkout
        if: steps.config.outputs.activo == 'true'
        uses: actions/checkout@v7
        with:
          # SonarQube necesita el historial completo para atribuir blame y detectar codigo nuevo.
          fetch-depth: 0

      - name: Bajar el reporte de cobertura del job build
        if: steps.config.outputs.activo == 'true'
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage

      # El builder de Angular deja el lcov en `coverage/` o en `coverage/<proyecto>/` según la
      # versión: se busca en vez de fijar la ruta.
      - name: Ubicar lcov.info
        if: steps.config.outputs.activo == 'true'
        id: lcov
        run: |
          lcov=$(find coverage -name lcov.info | head -1)
          test -n "$lcov" || { echo "::error::No hay lcov.info en el reporte de cobertura."; exit 1; }
          echo "ruta=$lcov" >> "$GITHUB_OUTPUT"

      - name: Analisis SonarQube
        if: steps.config.outputs.activo == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >-
            -Dsonar.projectKey=akine-web
            -Dsonar.projectName=akine-web
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.exclusions=src/app/api/generated/**,**/*.spec.ts
            -Dsonar.coverage.exclusions=src/app/api/generated/**,src/main.ts,src/environments/**
            -Dsonar.javascript.lcov.reportPaths=${{ steps.lcov.outputs.ruta }}

  contrato:
    name: Cliente API alineado con el contrato
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v7
        with:
          path: appKine-web

      # El backend es propietario del contrato canonico. Se clona junto al frontend, en la
      # MISMA rama cuando existe, para no comparar contra una version distinta de la que
      # este PR asume.
      - name: Checkout backend (contrato canonico)
        uses: actions/checkout@v7
        continue-on-error: true
        id: checkout-backend
        with:
          repository: Chapadiex/appKine-api
          ref: ${{ github.head_ref || github.ref_name }}
          path: appKine-api

      - name: Checkout backend (fallback a main)
        if: steps.checkout-backend.outcome == 'failure'
        uses: actions/checkout@v7
        with:
          repository: Chapadiex/appKine-api
          ref: main
          path: appKine-api

      - name: Configurar Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: appKine-web/package-lock.json

      - name: Instalar dependencias
        working-directory: appKine-web
        run: npm ci

      # openapi-generator corre sobre JVM.
      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar version de contrato declarada
        working-directory: appKine-web
        run: npm run api:check

      - name: Regenerar cliente y comprobar que no hay drift
        working-directory: appKine-web
        run: |
          npm run api:generate
          if [ -n "$(git status --porcelain src/app/api/generated)" ]; then
            echo "::error::El cliente generado no corresponde al contrato publicado."
            echo "Regeneralo con: npm run api:generate"
            git --no-pager diff -- src/app/api/generated
            exit 1
          fi
          echo "Cliente alineado con el contrato."

  # Contraste de color medido en un navegador de verdad.
  #
  # Es un job propio y NO un paso del job `build` porque necesita Chromium, que `build` no
  # instala: meterlo ahi le agregaria ~40 s de descarga a la corrida de lint y tests, que es la
  # que todo el mundo espera mirando.
  #
  # A diferencia del job `e2e` de mas abajo, este NO necesita el backend: la API se simula con
  # `route.fulfill` y lo unico que la auditoria necesita real es que la pantalla se pinte. Por eso
  # no espera a que se construya y arranque el backend.
  contraste:
    name: Contraste de color (WCAG AA, navegador real)
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Los dos temas, en dos proyectos. Playwright levanta el frontend por su cuenta.
      # Incluye `contraste-no-textual.spec.ts` (AKINE-G-7): bordes, foco, hover y teclado.
      - name: Auditar contraste, bordes, foco y teclado en modo claro y en modo oscuro
        run: npm run a11y:contraste

      # 375 px con toque: sin scroll horizontal de pagina y objetivos de 24 px (WCAG 1.4.10 y
      # 2.5.8). Tambien con la API simulada, asi que vive en este mismo job.
      - name: Auditar el ancho de telefono
        if: success() || failure()
        run: npm run a11y:movil

      - name: Publicar reporte
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: contraste-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Construye la imagen con el Dockerfile de la raiz y NO la publica en ningun registry: el job
  # prueba que la receta compila, que la imagen arranca y sirve la SPA, y deja el SBOM como
  # evidencia. Corre en paralelo con `build`: la imagen no ejecuta lint ni tests.
  #
  # El SBOM se extrae DE LA IMAGEN, igual que en el backend: el artifact es exactamente el
  # inventario que viaja con el bundle construido, no uno de un build paralelo.
  imagen:
    name: Imagen Docker y SBOM
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Construir imagen
        run: docker build --tag akine-web:${{ github.sha }} .

      - name: Extraer el SBOM embebido en la imagen
        run: |
          id=$(docker create akine-web:${{ github.sha }})
          mkdir -p sbom
          docker cp "$id:/usr/share/akine/sbom/akine-web.cdx.json" sbom/akine-web.cdx.json
          docker rm "$id"
          test -s sbom/akine-web.cdx.json
          echo "Imagen: $(docker image inspect akine-web:${{ github.sha }} --format '{{.Size}}') bytes"

      # CSP con nonce (AKINE-09.02): sin 'unsafe-inline' ni 'unsafe-hashes', todo <style> y todo
      # <script> inline del index.html tiene que llevar el marcador del nonce, y ningun elemento
      # un handler `on...=`. Si una version de Angular vuelve a emitir el `onload` de la hoja
      # diferida, o un <style> sin nonce, la CSP lo bloquea y la app se sirve SIN ESTILOS en
      # produccion sin que falle nada mas. Este paso lo convierte en un error.
      - name: Verificar que el index.html no necesita inline sin nonce
        run: |
          id=$(docker create akine-web:${{ github.sha }})
          docker cp "$id:/usr/share/nginx/html/index.html" index.prod.html
          docker rm "$id"
          falta=0
          if grep -Eo '<[a-z][^>]*[[:space:]]on[a-z]+=' index.prod.html; then
            echo "::error::El index.html trae un handler inline (on...=): la CSP sin 'unsafe-hashes' lo bloquea."
            falta=1
          fi
          if grep -Eo '<style[^>]*>' index.prod.html | grep -v 'nonce="AKINE_CSP_NONCE"'; then
            echo "::error::Un <style> del index.html no lleva el nonce: la CSP lo bloquea."
            falta=1
          fi
          if grep -Eo '<script[^>]*>' index.prod.html | grep -v 'src=' | grep -v 'type="application/json"' | grep -v 'nonce="AKINE_CSP_NONCE"'; then
            echo "::error::Un <script> inline del index.html no lleva el nonce: la CSP lo bloquea."
            falta=1
          fi
          grep -q 'ngcspnonce="AKINE_CSP_NONCE"\|ngCspNonce="AKINE_CSP_NONCE"' index.prod.html || {
            echo "::error::El index.html perdio ngCspNonce: Angular no le pone nonce a los <style> de componente."
            falta=1
          }
          if grep '^add_header Content-Security-Policy' docker/nginx/security-headers.conf | grep -q "unsafe-"; then
            echo "::error::La CSP volvio a permitir inline sin nonce."
            falta=1
          fi
          exit $falta

      - name: Arrancar la imagen y probar la SPA
        run: |
          docker run -d --name akine-web -p 8080:8080 akine-web:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          # Ruta profunda del router: tiene que devolver index.html, no 404.
          curl -fsS http://localhost:8080/una/ruta/profunda | grep -q '<app-root'
          # index.html sin cache ni validadores (un 304 dejaria el cuerpo con el nonce viejo); un
          # asset con hash, inmutable.
          curl -fsSI http://localhost:8080/ | grep -qi '^cache-control: no-store'
          ! curl -fsSI http://localhost:8080/ | grep -qi '^etag:'
          # El nonce (AKINE-09.02): el de la cabecera es el del cuerpo, cambia en cada pedido, el
          # marcador no llega al navegador y la CSP no admite inline sin nonce.
          nonce_de() {
            curl -fsS -D "cabeceras-$1.txt" -o "cuerpo-$1.html" "http://localhost:8080$2"
            grep -i '^content-security-policy:' "cabeceras-$1.txt" | grep -oE "'nonce-[0-9a-f]{32}'" | head -1 | tr -d "'" | sed 's/^nonce-//'
          }
          n1=$(nonce_de 1 /)
          n2=$(nonce_de 2 /una/ruta/profunda)
          test -n "$n1" && test -n "$n2" && test "$n1" != "$n2"
          grep -q "nonce=\"$n1\"" cuerpo-1.html
          grep -q "nonce=\"$n2\"" cuerpo-2.html
          ! grep -q 'AKINE_CSP_NONCE' cuerpo-1.html
          ! grep -i '^content-security-policy:' cabeceras-1.txt | grep -q 'unsafe-'
          for h in x-content-type-options referrer-policy permissions-policy x-frame-options; do
            grep -qi "^$h:" cabeceras-1.txt
          done
          asset=$(curl -fsS http://localhost:8080/ | grep -o 'main-[A-Z0-9]*\.js' | head -1)
          curl -fsSI "http://localhost:8080/$asset" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          # Un chunk perezoso tambien: con el optimizador de chunks su hash trae minusculas,
          # '-' y '_' (AKINE-LCP), y tiene que caer en el mismo location inmutable.
          hash=$(curl -fsS "http://localhost:8080/$asset" | grep -oE 'chunk-[A-Za-z0-9_-]{8}\.js' | sed 's/^chunk-//' | grep -E '[a-z_-]' | head -1)
          test -n "$hash"
          curl -fsSI "http://localhost:8080/chunk-$hash" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          curl -fsSI http://localhost:8080/ | grep -qi '^content-security-policy:'
          # JS y CSS precomprimidos (AKINE-LCP): Brotli a quien lo pide, gzip a quien no, sin
          # codificacion a quien no pide ninguna. Siempre con su Content-Type, la CSP y Vary.
          br=$(curl -fsSI -H 'Accept-Encoding: gzip, deflate, br' "http://localhost:8080/$asset")
          echo "$br" | grep -qi '^content-encoding: br'
          echo "$br" | grep -qi '^content-type: application/javascript'
          echo "$br" | grep -qi '^vary: accept-encoding'
          echo "$br" | grep -qi '^content-security-policy:'
          echo "$br" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          curl -fsSI -H 'Accept-Encoding: gzip' "http://localhost:8080/$asset" | grep -qi '^content-encoding: gzip'
          ! curl -fsSI -H 'Accept-Encoding: identity' "http://localhost:8080/$asset" | grep -qi '^content-encoding:'
          css=$(curl -fsS http://localhost:8080/ | grep -o 'styles-[A-Za-z0-9_-]*\.css' | head -1)
          curl -fsSI -H 'Accept-Encoding: br' "http://localhost:8080/$css" | grep -qi '^content-type: text/css'
          # El manifiesto de precarga de las pantallas viaja en el index.html (scripts/build-produccion.mjs).
          curl -fsS http://localhost:8080/ | grep -q 'id="akine-precarga"'
          test "$(docker exec akine-web id -u)" != "0"

      - name: Logs del contenedor
        if: failure()
        run: docker logs akine-web || true

      - name: Publicar SBOM
        uses: actions/upload-artifact@v7
        with:
          name: akine-web-sbom
          path: sbom/akine-web.cdx.json
          if-no-files-found: error
          retention-days: 90

  # E2E contra el backend REAL (AKINE G-9): MySQL + Mailpit + backend + frontend en el runner.
  #
  # El backend se construye con su propio Dockerfile, desde `Chapadiex/appKine-api` en la MISMA
  # rama que este PR cuando existe y si no desde `main`, igual que el job `contrato`. La imagen
  # no se publica en ningun registry: se construye aca, con la cache de capas de Actions para no
  # bajar Maven entero en cada corrida.
  #
  # MySQL y Mailpit salen del `compose.yaml` del backend y no de `services:` del job, porque
  # MySQL necesita `--log-bin-trust-function-creators=1` para los triggers de V14 y un service
  # container no admite argumentos de arranque. Ademas el contenedor queda con el nombre
  # `akine-mysql`, que es el que usan los specs viejos para sembrar por SQL.
  #
  # La base es NUEVA en cada corrida: el catalogo global esta vacio y crear un servicio exige rol
  # de plataforma. Por eso el backend arranca con AKINE_BOOTSTRAP_ADMIN_EMAIL (DP-14) y el
  # sembrado de `agenda-setup` activa esa cuenta por Mailpit y da de alta el servicio.
  #
  # Son tres partes (`--shard`), cada una con su runner y su pila entera. Con un solo backend no se
  # puede paralelizar: login y refresh comparten un limite por minuto y por IP. Cada parte tiene su
  # backend, asi que cada una tiene su cupo y el limite sigue prendido. Tampoco comparten datos:
  # Playwright no parte el proyecto `agenda-setup`, que siembra su base en cada una.
  e2e-parte:
    name: E2E parte ${{ matrix.parte }} de 3
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]

    env:
      # La misma casilla en el backend (bootstrap) y en el sembrado (e2e/support/sembrado.ts).
      AKINE_E2E_PLATAFORMA_EMAIL: plataforma.e2e@ejemplo.test

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v7
        with:
          path: appKine-web

      - name: Checkout backend (misma rama)
        uses: actions/checkout@v7
        continue-on-error: true
        id: checkout-backend
        with:
          repository: Chapadiex/appKine-api
          ref: ${{ github.head_ref || github.ref_name }}
          path: appKine-api

      - name: Checkout backend (fallback a main)
        if: steps.checkout-backend.outcome == 'failure'
        uses: actions/checkout@v7
        with:
          repository: Chapadiex/appKine-api
          ref: main
          path: appKine-api

      - name: Version del backend bajo prueba
        working-directory: appKine-api
        run: |
          echo "Backend: $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD)"
          echo "Contrato: $(grep -o '<akine.contract.version>[^<]*' pom.xml | cut -d'>' -f2)"

      # Proyecto `akine` explicito: la red queda como `akine_default` y el backend se engancha ahi.
      - name: Levantar MySQL y Mailpit
        run: docker compose -p akine -f appKine-api/compose.yaml up -d --wait

      - name: Preparar buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: appKine-api
          tags: akine-api:e2e
          load: true
          cache-from: type=gha,scope=akine-api-e2e
          cache-to: type=gha,mode=max,scope=akine-api-e2e

      # Perfil `local`: secreto de JWT de desarrollo, SMTP sin TLS contra Mailpit y CORS de
      # localhost. Es exactamente la pila con la que corren los E2E en una maquina de desarrollo.
      - name: Arrancar el backend
        run: |
          docker run -d --name akine-api --network akine_default -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=local \
            -e AKINE_DB_URL='jdbc:mysql://mysql:3306/akine_local?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC' \
            -e AKINE_DB_USER=akine -e AKINE_DB_PASSWORD=akine \
            -e AKINE_MAIL_HOST=mailpit -e AKINE_MAIL_PORT=1025 \
            -e AKINE_BOOTSTRAP_ADMIN_EMAIL="$AKINE_E2E_PLATAFORMA_EMAIL" \
            akine-api:e2e

      - name: Configurar Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: appKine-web/package-lock.json

      - name: Instalar dependencias
        working-directory: appKine-web
        run: npm ci

      - name: Instalar Chromium
        working-directory: appKine-web
        run: npx playwright install --with-deps chromium

      # El primer arranque aplica todas las migraciones contra la base vacia (~2,5 min medido).
      - name: Esperar a que el backend este listo
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null 2>&1; then
              echo "Backend listo."
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' akine-api)" != "true" ]; then
              echo "::error::El backend se cayo al arrancar."
              docker logs akine-api | tail -200
              exit 1
            fi
            sleep 5
          done
          echo "::error::El backend no quedo listo en 10 minutos."
          docker logs akine-api | tail -200
          exit 1

      # `agenda` arrastra a `agenda-setup` por `dependencies`. `chromium` son los specs del
      # stack real de 01.02 (auth, contexto, errores, smoke). Los de contraste corren en su job.
      #
      # Fuera: el smoke "misma version de contrato". Compara `contractVersion` contra el
      # `/api/v1/version` del backend, que es exactamente lo que ya hace el job `contrato` con el
      # YAML, y falla cada vez que el backend publica una minor antes de que se regenere el
      # cliente. Ese desfasaje se ve en `contrato`; aca tumbaria la corrida entera de E2E por algo
      # que no es un flujo.
      - name: Correr los E2E
        working-directory: appKine-web
        run: >-
          npx playwright test --project=agenda --project=chromium
          --grep-invert "misma version de contrato"
          --shard=${{ matrix.parte }}/3

      - name: Logs del backend
        if: failure()
        run: docker logs akine-api > backend.log 2>&1 || true

      - name: Publicar reporte, trazas y capturas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.parte }}
          path: |
            appKine-web/playwright-report/
            appKine-web/test-results/
            backend.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Apagar la pila
        if: always()
        run: |
          docker rm -f akine-api || true
          docker compose -p akine -f appKine-api/compose.yaml down -v || true

  # El check obligatorio de la protección de main. Junta las tres partes bajo el nombre de siempre,
  # para no depender de los nombres de la matriz. "skipped" vale: es un PR de sólo documentación.
  e2e:
    name: E2E Playwright contra el backend real
    needs: e2e-parte
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verificar las tres partes
        env:
          RESULTADO: ${{ needs.e2e-parte.result }}
        run: |
          echo "Resultado de las partes: $RESULTADO"
          test "$RESULTADO" = success || test "$RESULTADO" = skipped
