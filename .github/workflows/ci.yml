name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Lint, build y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` en lugar de `npm install`: respeta el lockfile al pie de la letra.
      # Si package-lock.json esta desincronizado, falla en vez de resolver por su cuenta.
      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato
        run: npm run format:check

      # ESLint incluye las reglas propias de AKINE: prohibicion de localStorage y
      # sessionStorage (ADR-0001) y las reglas de accesibilidad de plantilla, que son
      # requisito WCAG 2.1 AA del proyecto.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Incluye el gate de cobertura: falla por debajo del 80 % en cualquier contador.
      - name: Tests unitarios y cobertura
        run: npm run test:ci

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      # El cliente de src/app/api/generated NO se edita a mano. Si el commiteado difiere
      # del que produce el contrato, alguien lo toco o quedo desactualizado.
      #
      # Requiere el contrato del backend. Ver el job `contrato` mas abajo.
      - name: Publicar build
        uses: actions/upload-artifact@v4
        with:
          name: akine-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  contrato:
    name: Cliente API alineado con el contrato
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: appKine-web

      # El backend es propietario del contrato canonico. Se clona junto al frontend, en la
      # MISMA rama cuando existe, para no comparar contra una version distinta de la que
      # este PR asume.
      - name: Checkout backend (contrato canonico)
        uses: actions/checkout@v4
        continue-on-error: true
        id: checkout-backend
        with:
          repository: Chapadiex/appKine-api
          ref: ${{ github.head_ref || github.ref_name }}
          path: appKine-api

      - name: Checkout backend (fallback a main)
        if: steps.checkout-backend.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: Chapadiex/appKine-api
          ref: main
          path: appKine-api

      - name: Configurar Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: appKine-web/package-lock.json

      - name: Instalar dependencias
        working-directory: appKine-web
        run: npm ci

      # openapi-generator corre sobre JVM.
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar version de contrato declarada
        working-directory: appKine-web
        run: npm run api:check

      - name: Regenerar cliente y comprobar que no hay drift
        working-directory: appKine-web
        run: |
          npm run api:generate
          if [ -n "$(git status --porcelain src/app/api/generated)" ]; then
            echo "::error::El cliente generado no corresponde al contrato publicado."
            echo "Regeneralo con: npm run api:generate"
            git --no-pager diff -- src/app/api/generated
            exit 1
          fi
          echo "Cliente alineado con el contrato."

  # Contraste de color medido en un navegador de verdad.
  #
  # Es un job propio y NO un paso del job `build` porque necesita Chromium, que `build` no
  # instala: meterlo ahi le agregaria ~40 s de descarga a la corrida de lint y tests, que es la
  # que todo el mundo espera mirando.
  #
  # A diferencia del job `e2e` de mas abajo, este NO necesita el backend: la API se simula con
  # `route.fulfill` y lo unico que la auditoria necesita real es que la pantalla se pinte. Por eso
  # esta activo y aquel sigue comentado.
  contraste:
    name: Contraste de color (WCAG AA, navegador real)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Los dos temas, en dos proyectos. Playwright levanta el frontend por su cuenta.
      # Incluye `contraste-no-textual.spec.ts` (AKINE-G-7): bordes, foco, hover y teclado.
      - name: Auditar contraste, bordes, foco y teclado en modo claro y en modo oscuro
        run: npm run a11y:contraste

      - name: Publicar reporte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contraste-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Construye la imagen con el Dockerfile de la raiz y NO la publica en ningun registry: el job
  # prueba que la receta compila, que la imagen arranca y sirve la SPA, y deja el SBOM como
  # evidencia. Corre en paralelo con `build`: la imagen no ejecuta lint ni tests.
  #
  # El SBOM se extrae DE LA IMAGEN, igual que en el backend: el artifact es exactamente el
  # inventario que viaja con el bundle construido, no uno de un build paralelo.
  imagen:
    name: Imagen Docker y SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build --tag akine-web:${{ github.sha }} .

      - name: Extraer el SBOM embebido en la imagen
        run: |
          id=$(docker create akine-web:${{ github.sha }})
          mkdir -p sbom
          docker cp "$id:/usr/share/akine/sbom/akine-web.cdx.json" sbom/akine-web.cdx.json
          docker rm "$id"
          test -s sbom/akine-web.cdx.json
          echo "Imagen: $(docker image inspect akine-web:${{ github.sha }} --format '{{.Size}}') bytes"

      # La CSP permite por hash el onload con el que Angular carga la hoja de estilos diferida.
      # Si una version de Angular cambia ese texto, el hash deja de coincidir y la app se sirve
      # SIN ESTILOS en produccion sin que falle nada mas. Este paso lo convierte en un error.
      - name: Verificar que la CSP cubre los handlers inline del index.html
        run: |
          id=$(docker create akine-web:${{ github.sha }})
          docker cp "$id:/usr/share/nginx/html/index.html" index.prod.html
          docker rm "$id"
          grep -o 'onload="[^"]*"' index.prod.html | sed 's/^onload="//;s/"$//' | sort -u > handlers.txt || true
          falta=0
          while IFS= read -r h; do
            hash=$(printf '%s' "$h" | openssl dgst -sha256 -binary | base64)
            if ! grep -qF "'sha256-$hash'" docker/nginx/security-headers.conf; then
              echo "::error::El handler inline \"$h\" (sha256-$hash) no esta en la CSP de docker/nginx/security-headers.conf."
              falta=1
            fi
          done < handlers.txt
          exit $falta

      - name: Arrancar la imagen y probar la SPA
        run: |
          docker run -d --name akine-web -p 8080:8080 akine-web:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          # Ruta profunda del router: tiene que devolver index.html, no 404.
          curl -fsS http://localhost:8080/una/ruta/profunda | grep -q '<app-root>'
          # index.html sin cache; un asset con hash, inmutable.
          curl -fsSI http://localhost:8080/ | grep -qi '^cache-control: no-cache'
          asset=$(curl -fsS http://localhost:8080/ | grep -o 'main-[A-Z0-9]*\.js' | head -1)
          curl -fsSI "http://localhost:8080/$asset" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          curl -fsSI http://localhost:8080/ | grep -qi '^content-security-policy:'
          test "$(docker exec akine-web id -u)" != "0"

      - name: Logs del contenedor
        if: failure()
        run: docker logs akine-web || true

      - name: Publicar SBOM
        uses: actions/upload-artifact@v4
        with:
          name: akine-web-sbom
          path: sbom/akine-web.cdx.json
          if-no-files-found: error
          retention-days: 90

  # PENDIENTE(AKINE-00.02): los E2E necesitan el stack completo (MySQL + backend + frontend).
  # Se activan cuando exista la imagen Docker del backend que publica su pipeline, para no
  # compilar Java dentro del job del frontend.
